<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Duo Explorer</title>
    <meta name="description" content="What an app can do on iPhone Duo, in every pose — closed, open, book and table — emulated in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 6 4 3v23l12 3 12-3V3z' fill='%23d2552a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <span class="wordmark">Duo <b>Explorer</b></span>
        <span class="tagline">What an app can do on iPhone Duo, in every pose.</span>
        <nav>
          <a href="https://github.com/dalmaer/duo/blob/main/SPEC.md">Spec</a>
          <a href="https://github.com/dalmaer/duo/blob/main/docs/ROADMAP.md">Roadmap</a>
          <a href="https://github.com/dalmaer/duo">GitHub</a>
        </nav>
      </header>
      <aside class="catalog" id="catalog" aria-label="Examples"></aside>
      <main class="stage">
        <div class="device-host" id="device"></div>
        <div class="poses" id="poses" role="toolbar" aria-label="Pose"></div>
      </main>
      <section class="panel" id="panel" aria-live="polite"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
