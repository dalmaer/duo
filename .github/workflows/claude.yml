name: Claude

# Mention @claude on an issue, a PR, or a review comment and Claude works on it
# in this repo, with AGENTS.md and the skills in .agents/skills as context. It
# opens pull requests; a person merges (docs/phases/10-agents-build-it.md).
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`)
# or ANTHROPIC_API_KEY.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(npm run *),Bash(npm test),Bash(npx tsc *),Bash(git *),Edit,Write,Read,Glob,Grep"
